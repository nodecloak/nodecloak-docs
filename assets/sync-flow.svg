<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">NodeCloak encrypted sync flow</title><desc id="desc">Choose profiles, encrypt locally, sync between authorized devices.</desc>
  <rect width="960" height="260" rx="26" fill="#11151b" stroke="#29313b"/><g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(60 64)"><rect width="218" height="132" rx="18" fill="#1b222b" stroke="#3f4a56"/><text x="109" y="47" fill="#40d995" font-size="13" letter-spacing="2">01 · SELECT</text><text x="109" y="83" fill="#f4f4f1" font-size="19" font-weight="700">Choose profiles</text><text x="109" y="108" fill="#a9b5bf" font-size="13">and sync options</text></g>
    <path d="M292 130h72m-12-10 12 10-12 10" fill="none" stroke="#40d995" stroke-width="2"/>
    <g transform="translate(372 64)"><rect width="218" height="132" rx="18" fill="#1b222b" stroke="#3f4a56"/><text x="109" y="47" fill="#40d995" font-size="13" letter-spacing="2">02 · ENCRYPT</text><text x="109" y="83" fill="#f4f4f1" font-size="19" font-weight="700">On your device</text><text x="109" y="108" fill="#a9b5bf" font-size="13">with your recovery key</text></g>
    <path d="M604 130h72m-12-10 12 10-12 10" fill="none" stroke="#40d995" stroke-width="2"/>
    <g transform="translate(684 64)"><rect width="218" height="132" rx="18" fill="#1b222b" stroke="#3f4a56"/><text x="109" y="47" fill="#40d995" font-size="13" letter-spacing="2">03 · CONTINUE</text><text x="109" y="83" fill="#f4f4f1" font-size="19" font-weight="700">Authorized devices</text><text x="109" y="108" fill="#a9b5bf" font-size="13">review conflicts together</text></g>
  </g>
</svg>
