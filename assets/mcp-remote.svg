<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Remote NodeCloak MCP connection</title><desc id="desc">An AI client connects through the NodeCloak HTTPS gateway. You approve a separate connection on the desktop, which operates the browser profiles you choose.</desc>
  <rect width="960" height="300" rx="26" fill="#11151b" stroke="#29313b"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <text x="480" y="40" fill="#a9b5bf" font-size="12" letter-spacing="3">PAIR ONCE · CHOOSE ACCESS · STAY IN CONTROL</text>
    <g transform="translate(34 80)"><rect width="178" height="140" rx="18" fill="#1b222b" stroke="#3f4a56"/><path d="M54 34h70v46H86L71 95V80H54Z" fill="none" stroke="#40d995" stroke-width="2"/><text x="89" y="116" fill="#f4f4f1" font-size="17" font-weight="700">AI client</text></g>
    <path d="M220 150h48m-9-7 9 7-9 7" fill="none" stroke="#40d995" stroke-width="2"/>
    <g transform="translate(277 80)"><rect width="178" height="140" rx="18" fill="#1b222b" stroke="#40d995"/><path d="M63 76a14 14 0 1 1 2-28 23 23 0 0 1 45-3 16 16 0 1 1 4 31Z" fill="none" stroke="#40d995" stroke-width="2"/><text x="89" y="107" fill="#f4f4f1" font-size="16" font-weight="700">NodeCloak gateway</text><text x="89" y="127" fill="#a9b5bf" font-size="11">HTTPS · OAuth</text></g>
    <path d="M463 150h48m-9-7 9 7-9 7" fill="none" stroke="#40d995" stroke-width="2"/>
    <g transform="translate(520 80)"><rect width="178" height="140" rx="18" fill="#1b222b" stroke="#40d995"/><rect x="56" y="31" width="66" height="45" rx="6" fill="none" stroke="#40d995" stroke-width="2"/><path d="M49 84h80m-40-8v8m-18-30 12 12 23-26" fill="none" stroke="#40d995" stroke-width="2"/><text x="89" y="107" fill="#f4f4f1" font-size="16" font-weight="700">Your desktop</text><text x="89" y="127" fill="#a9b5bf" font-size="11">approve · scope · revoke</text></g>
    <path d="M706 150h35m-9-7 9 7-9 7" fill="none" stroke="#40d995" stroke-width="2"/>
    <g transform="translate(750 80)"><rect width="176" height="140" rx="18" fill="#1b222b" stroke="#3f4a56"/><rect x="55" y="32" width="66" height="49" rx="6" fill="none" stroke="#a9b5bf" stroke-width="2"/><path d="M62 43h52m-52 12h36m-36 12h44" stroke="#40d995" stroke-width="2"/><text x="88" y="107" fill="#f4f4f1" font-size="16" font-weight="700">Chosen profiles</text><text x="88" y="127" fill="#a9b5bf" font-size="11">Chrome · Edge · Firefox</text></g>
    <text x="480" y="263" fill="#a9b5bf" font-size="13">Keep NodeCloak running on your approved device.</text>
  </g>
</svg>
